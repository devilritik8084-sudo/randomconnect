<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RandomConnect</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
    }
    header {
      background: #172337;
      padding: 22px 12px;
      text-align: center;
    }
    main {
      max-width: 520px;
      margin: auto;
      padding: 18px;
    }
    .panel {
      background: #1b2940;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 16px;
    }
    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 9px;
      background: #7c5cff;
      color: white;
      font-size: 16px;
      margin-top: 10px;
    }
    .muted { color: #bac5d6; line-height: 1.6; }
    #status { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <header>
    <h1>RandomConnect</h1>
    <p>Meet • Chat • Connect</p>
  </header>

  <main>
    <section class="panel">
      <h2>Connection status</h2>
      <p id="status">Connecting to Firebase...</p>
      <button id="connectBtn">Reconnect</button>
    </section>

    <section class="panel">
      <h2>Start connecting</h2>
      <p class="muted">
        Random text and video chat are being set up.
        Please do not share your phone number, address,
        passwords or private information with strangers.
      </p>
      <button id="textBtn" disabled>Text Chat — Coming Soon</button>
      <button id="videoBtn" disabled>Video Chat — Coming Soon</button>
    </section>

    <p class="muted">
      Test version. Chat features are not active yet.
    </p>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC033yiIQMg4RB0ss6eofSpG6x-e-rfSD8",
      authDomain: "randomconnect-9a1ad.firebaseapp.com",
      databaseURL: "https://randomconnect-9a1ad-default-rtdb.firebaseio.com",
      projectId: "randomconnect-9a1ad",
      storageBucket: "randomconnect-9a1ad.firebasestorage.app",
      messagingSenderId: "998406231089",
      appId: "1:998406231089:web:31697b8d904392a36f7110"
    };

    const statusText = document.getElementById("status");
    const connectBtn = document.getElementById("connectBtn");

    let database = null;

    async function connectFirebase() {
      connectBtn.disabled = true;
      statusText.textContent = "Connecting...";

      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }

        const auth = firebase.auth();
        database = firebase.database();

        if (!auth.currentUser) {
          await auth.signInAnonymously();
        }

        database.ref(".info/connected").on("value", snapshot => {
          if (snapshot.val() === true) {
            statusText.textContent =
              "Firebase connected. Anonymous sign-in successful.";
          } else {
            statusText.textContent =
              "Signed in, but database is disconnected.";
          }
        });
      } catch (error) {
        statusText.textContent =
          "Connection error: " + error.message;
      } finally {
        connectBtn.disabled = false;
      }
    }

    connectBtn.addEventListener("click", connectFirebase);
    connectFirebase();
  </script>
</body>
</html>
